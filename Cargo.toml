[workspace]
resolver = "3"
members = [
    "crates/nodlance-domain",
    "crates/nodlance-db",
    "crates/nodlance-auth",
    "crates/nodlance-api",
    "crates/nodlance-adapter-postgres",
    "crates/nodlance-adapter-mysql",
    "crates/nodlance-agent",
    "crates/nodlance-worker",
    "crates/nodlance-provider-linux",
    "crates/nodlance-provider-docker",
    "crates/nodlance-provider-k8s",
    "crates/nodlance-recovery",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Nodlance/nodlance"

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "chrono", "migrate", "json"] }
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
nodlance-adapter-mysql = { path = "crates/nodlance-adapter-mysql" }
nodlance-adapter-postgres = { path = "crates/nodlance-adapter-postgres" }
nodlance-agent = { path = "crates/nodlance-agent" }
nodlance-auth = { path = "crates/nodlance-auth" }
nodlance-db = { path = "crates/nodlance-db" }
nodlance-domain = { path = "crates/nodlance-domain" }
nodlance-worker = { path = "crates/nodlance-worker" }
nodlance-provider-linux = { path = "crates/nodlance-provider-linux" }
nodlance-provider-docker = { path = "crates/nodlance-provider-docker" }
nodlance-provider-k8s = { path = "crates/nodlance-provider-k8s" }
nodlance-recovery = { path = "crates/nodlance-recovery" }


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
