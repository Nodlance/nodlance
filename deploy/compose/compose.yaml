services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nodlance
      POSTGRES_USER: nodlance
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nodlance -d nodlance" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nodlance-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      RUST_LOG: "info"
      DATABASE_URL: "postgres://nodlance:localdev@postgres:5432/nodlance"
      JWT_SECRET: "change-me-in-production-min-32-chars-key"
      NODLANCE_ADMIN_PASSWORD: "adminpassword"
      NODLANCE_STATIC_DIR: "/app/ui/dist"
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
