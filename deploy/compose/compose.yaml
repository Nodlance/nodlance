services:
  nodlance-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      RUST_LOG: "info"
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
