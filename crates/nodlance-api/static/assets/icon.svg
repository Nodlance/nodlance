  <circle cx="22" cy="75" r="7.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
  <circle cx="78" cy="75" r="7.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
