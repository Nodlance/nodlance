  <path d="M50 20 L78 75" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M22 75 H44" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M56 75 H78" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Central Lance (Shaft & Spearhead) -->
