<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none" width="100%" height="100%">
  <!-- Icon Mark (32x32) -->
  <g transform="translate(4, 4) scale(0.32)">
    <!-- Cluster Connections -->
    <path d="M50 20 L22 75" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 20 L78 75" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 75 H44" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 75 H78" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Lance -->
    <path d="M50 75 V54" stroke="#0284C7" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 32 L39 54 L50 49 Z" fill="#0284C7"/>
    <path d="M50 32 L61 54 L50 49 Z" fill="#38BDF8"/>

    <!-- Three Nodes -->
    <circle cx="50" cy="20" r="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
    <circle cx="22" cy="75" r="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
    <circle cx="78" cy="75" r="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
  </g>

  <!-- Clean UI Typography -->
  <text x="46" y="27" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="0.3" 
        fill="#F8FAFC">
    Nodlance
  </text>
</svg>
