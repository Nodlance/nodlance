openapi: 3.1.0
info:
  title: Nodlance API
  version: 0.1.0
  description: Nodlance control plane API for database operations, host inventory, and agent enrollment.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      summary: Process liveness probe
      operationId: getLiveness
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      summary: Process readiness probe
      description: Verifies control plane readiness including database connectivity.
      operationId: getReadiness
      responses:
        '200':
          description: Control plane is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database connection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/version:
    get:
      summary: Version and implementation stage
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create new user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/hosts:
    get:
      summary: List hosts
      operationId: listHosts
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, decommissioned]
        - name: hostname_contains
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Register a new host
      operationId: createHost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewHost'
      responses:
        '201':
          description: Host created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hosts/{id}:
    get:
      summary: Get host by ID
      operationId: getHost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Host details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update host
      operationId: updateHost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHost'
      responses:
        '200':
          description: Host updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Decommission host
      operationId: decommissionHost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Host decommissioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hosts/{id}/enroll:
    post:
      summary: Enroll agent identity on host
      operationId: enrollAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Agent enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hosts/{id}/revoke:
    post:
      summary: Revoke active agent on host
      operationId: revokeAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/audit:
    get:
      summary: Query audit events
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hosts/{id}/metrics:
    get:
      summary: Retrieve recent host metrics history
      operationId: getHostMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Host metrics timeseries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentHeartbeat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agent/heartbeat:
    post:
      summary: Receive agent heartbeat and telemetry
      operationId: receiveHeartbeat
      parameters:
        - name: x-agent-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatPayload'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeat'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/clusters:
    get:
      summary: List registered clusters
      operationId: listClusters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseCluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create database cluster
      operationId: createCluster
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClusterRequest'
      responses:
        '201':
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/clusters/{id}:
    get:
      summary: Get cluster details
      operationId: getCluster
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{id}/nodes:
    post:
      summary: Register node in cluster
      operationId: addNodeToCluster
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNodeRequest'
      responses:
        '201':
          description: Node added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{id}/topology:
    get:
      summary: Get observed cluster topology
      operationId: getClusterTopology
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Observed topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterTopology'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{id}/backups:
    post:
      summary: Trigger backup workflow for cluster
      operationId: triggerClusterBackup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Backup job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List backup artifacts for cluster
      operationId: listClusterBackups
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of backup artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupArtifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backups/{id}:
    get:
      summary: Get backup artifact details
      operationId: getBackupDetails
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Backup artifact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupArtifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/backups/{id}/verify:
    post:
      summary: Trigger restore validation drill for backup
      operationId: verifyBackup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Verification drill job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/backups/{id}/drills/latest:
    get:
      summary: Get latest restore validation drill result
      operationId: getLatestDrill
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest drill result or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreValidationDrill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/jobs:
    get:
      summary: List durable background jobs
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of durable jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/jobs/{id}:
    get:
      summary: Get job details by ID
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/alerts/rules:
    get:
      summary: List configured alert rules
      operationId: listAlertRules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts:
    get:
      summary: List active alert incidents
      operationId: listActiveAlerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertIncident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert incident
      operationId: acknowledgeAlert
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Acknowledged incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertIncident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/maintenance-windows:
    post:
      summary: Schedule a maintenance window
      operationId: createMaintenanceWindow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMaintenanceWindowRequest'
      responses:
        '201':
          description: Window created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/provisioning/plans:
    post:
      summary: Create guarded database provisioning plan
      operationId: createProvisioningPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProvisioningPlanRequest'
      responses:
        '201':
          description: Provisioning plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List guarded provisioning plans
      operationId: listProvisioningPlans
      security:
        - bearerAuth: []
      parameters:
        - name: cluster_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of provisioning plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvisioningPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/provisioning/plans/{id}:
    get:
      summary: Get provisioning plan details
      operationId: getProvisioningPlan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provisioning plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/provisioning/plans/{id}/steps:
    get:
      summary: Get step progression for provisioning plan
      operationId: listProvisioningPlanSteps
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of plan steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvisioningStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/provisioning/plans/{id}/execute:
    post:
      summary: Enqueue execution of provisioning plan
      operationId: executeProvisioningPlan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Provisioning job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/provisioning/plans/{id}/rollback:
    post:
      summary: Enqueue rollback compensation for provisioning plan
      operationId: rollbackProvisioningPlan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Rollback job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/discovery/scan:
    post:
      summary: Trigger workload discovery scan
      operationId: triggerDiscoveryScan
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerScanRequest'
      responses:
        '202':
          description: Discovery scan job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/discovery/workloads:
    get:
      summary: List discovered database workloads
      operationId: listDiscoveredWorkloads
      security:
        - bearerAuth: []
      parameters:
        - name: provider_type
          in: query
          schema:
            $ref: '#/components/schemas/ProviderType'
      responses:
        '200':
          description: List of discovered workloads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoveredWorkload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/discovery/workloads/{id}:
    get:
      summary: Get discovered workload details
      operationId: getDiscoveredWorkload
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Discovered workload details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredWorkload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{id}/recovery/candidates:
    get:
      summary: List candidate replicas evaluated for promotion
      operationId: listRecoveryCandidates
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of evaluated candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionCandidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clusters/{id}/recovery/promote:
    post:
      summary: Request operator-approved replica promotion
      operationId: requestPromotion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPromotionPayload'
      responses:
        '201':
          description: Promotion request created in pending_approval state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/clusters/{id}/recovery/promote/{req_id}/approve:
    post:
      summary: Approve replica promotion with operator token
      operationId: approvePromotion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: req_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePromotionPayload'
      responses:
        '200':
          description: Promotion request approved and queued for execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/clusters/{id}/recovery/fence:
    post:
      summary: Execute verifiable fencing of a node
      operationId: fenceNode
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FenceNodePayload'
      responses:
        '202':
          description: Fencing job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/clusters/{id}/recovery/epoch:
    get:
      summary: Get cluster term/epoch status
      operationId: getClusterEpoch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current cluster epoch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/recovery/fault-injection:
    post:
      summary: Run fault-injection qualification test suite
      operationId: runFaultInjection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fault injection simulation results
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict / unique violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    VersionResponse:
      type: object
      required: [name, version, stage]
      properties:
        name:
          type: string
          example: Nodlance
        version:
          type: string
          example: 0.1.0
        stage:
          type: string
          example: inventory_and_enrollment

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 86400
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required: [id, username, is_active, permissions]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        permissions:
          type: array
          items:
            type: string

    User:
      type: object
      required: [id, username, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NewUser:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 8
        display_name:
          type: string

    Host:
      type: object
      required: [id, hostname, labels, status, created_at, updated_at, created_by]
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        ip_address:
          type: string
          nullable: true
        os_family:
          type: string
          nullable: true
        os_version:
          type: string
          nullable: true
        labels:
          type: object
        status:
          type: string
          enum: [active, inactive, decommissioned]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    NewHost:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
        ip_address:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        labels:
          type: object

    UpdateHost:
      type: object
      properties:
        hostname:
          type: string
        ip_address:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        labels:
          type: object
        status:
          type: string
          enum: [active, inactive, decommissioned]

    AgentIdentity:
      type: object
      required: [id, host_id, fingerprint, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        fingerprint:
          type: string
        status:
          type: string
          enum: [pending, enrolled, revoked]
        enrolled_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    EnrollmentRequest:
      type: object
      required: [fingerprint]
      properties:
        fingerprint:
          type: string

    AuditEvent:
      type: object
      required: [id, timestamp, actor_id, action, resource_type]
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        details:
          type: object
          nullable: true
        source_ip:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    AgentHeartbeat:
      type: object
      required: [id, host_id, agent_version, recorded_at]
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        agent_version:
          type: string
        metrics:
          $ref: '#/components/schemas/HostMetrics'
        recorded_at:
          type: string
          format: date-time

    HeartbeatPayload:
      type: object
      required: [host_id, agent_version]
      properties:
        host_id:
          type: string
          format: uuid
        agent_version:
          type: string
        metrics:
          $ref: '#/components/schemas/HostMetrics'

    HostMetrics:
      type: object
      required: [cpu_usage_percent, memory_total_bytes, memory_used_bytes]
      properties:
        cpu_usage_percent:
          type: number
        memory_total_bytes:
          type: integer
        memory_used_bytes:
          type: integer
        disk_total_bytes:
          type: integer
          nullable: true
        disk_used_bytes:
          type: integer
          nullable: true
        load_average_1m:
          type: number
          nullable: true
        load_average_5m:
          type: number
          nullable: true
        load_average_15m:
          type: number
          nullable: true

    DatabaseCluster:
      type: object
      required: [id, name, engine, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NewClusterRequest:
      type: object
      required: [name, engine]
      properties:
        name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]

    DatabaseNode:
      type: object
      required: [id, cluster_id, host_id, port, role, health, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        port:
          type: integer
        role:
          type: string
          enum: [primary, replica, standalone, unknown]
        health:
          type: string
          enum: [healthy, degraded, unreachable, unknown]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NewNodeRequest:
      type: object
      required: [host_id, port]
      properties:
        host_id:
          type: string
          format: uuid
        port:
          type: integer
        role:
          type: string
          enum: [primary, replica, standalone, unknown]

    ClusterTopology:
      type: object
      required: [cluster_id, nodes, observed_at]
      properties:
        cluster_id:
          type: string
          format: uuid
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ObservedNode'
        observed_at:
          type: string
          format: date-time

    ObservedNode:
      type: object
      required: [node_id, role, health]
      properties:
        node_id:
          type: string
          format: uuid
        role:
          type: string
        health:
          type: string
        replication_lag_seconds:
          type: number
          nullable: true
        is_read_only:
          type: boolean
        details:
          type: object
          nullable: true

    Job:
      type: object
      required: [id, job_type, status, idempotency_key, payload, attempt_count, max_attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        job_type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        idempotency_key:
          type: string
        payload:
          type: object
        result:
          type: object
          nullable: true
        error_message:
          type: string
          nullable: true
        lease_owner:
          type: string
          nullable: true
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
        attempt_count:
          type: integer
        max_attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobType:
      type: string
      enum: [backup_cluster, restore_drill, reconciliation, health_check]

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, unknown_outcome, reconciliation_required]

    BackupArtifact:
      type: object
      required: [id, cluster_id, node_id, job_id, engine, engine_version, backup_type, storage_location, size_bytes, checksum_sha256, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]
        engine_version:
          type: string
        backup_type:
          $ref: '#/components/schemas/BackupType'
        storage_location:
          type: string
        size_bytes:
          type: integer
        checksum_sha256:
          type: string
        status:
          $ref: '#/components/schemas/BackupStatus'
        retention_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    BackupType:
      type: string
      enum: [full, incremental, differential]

    BackupStatus:
      type: string
      enum: [pending, completed, corrupt, failed]

    RestoreValidationDrill:
      type: object
      required: [id, backup_id, verified_at, is_valid, verification_report]
      properties:
        id:
          type: string
          format: uuid
        backup_id:
          type: string
          format: uuid
        verified_at:
          type: string
          format: date-time
        is_valid:
          type: boolean
        verification_report:
          type: object

    AlertRule:
      type: object
      required: [id, name, metric_name, condition, threshold, severity, is_enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metric_name:
          type: string
        condition:
          type: string
        threshold:
          type: number
        severity:
          type: string
        is_enabled:
          type: boolean

    AlertIncident:
      type: object
      required: [id, rule_id, status, triggered_at]
      properties:
        id:
          type: string
          format: uuid
        rule_id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
          nullable: true
        node_id:
          type: string
          format: uuid
          nullable: true
        host_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        summary:
          type: string
        triggered_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true

    MaintenanceWindow:
      type: object
      required: [id, resource_type, starts_at, ends_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    NewMaintenanceWindowRequest:
      type: object
      required: [resource_type, starts_at, ends_at]
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    ProviderType:
      type: string
      enum: [linux_vm, docker, kubernetes]

    ProvisioningStatus:
      type: string
      enum: [draft, pending, running, succeeded, failed, rolled_back]

    ProvisioningStepType:
      type: string
      enum: [preflight_check, render_configuration, prepare_storage, initialize_database, start_service, verify_readiness]

    StepStatus:
      type: string
      enum: [pending, running, succeeded, failed, rolled_back]

    ProvisioningConfig:
      type: object
      properties:
        port:
          type: integer
          nullable: true
        data_directory:
          type: string
          nullable: true
        max_connections:
          type: integer
          nullable: true
        shared_buffers_mb:
          type: integer
          nullable: true
        memory_limit_mb:
          type: integer
          nullable: true
        cpu_limit_cores:
          type: number
          nullable: true
        container_image:
          type: string
          nullable: true
        namespace:
          type: string
          nullable: true
        extra_params:
          type: object
          nullable: true

    ProvisioningPlan:
      type: object
      required: [id, cluster_id, provider_type, engine, engine_version, config, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
          nullable: true
        provider_type:
          $ref: '#/components/schemas/ProviderType'
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]
        engine_version:
          type: string
        config:
          $ref: '#/components/schemas/ProvisioningConfig'
        status:
          $ref: '#/components/schemas/ProvisioningStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NewProvisioningPlanRequest:
      type: object
      required: [cluster_id, provider_type, engine, engine_version, config]
      properties:
        cluster_id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
          nullable: true
        provider_type:
          $ref: '#/components/schemas/ProviderType'
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]
        engine_version:
          type: string
        config:
          $ref: '#/components/schemas/ProvisioningConfig'

    ProvisioningStep:
      type: object
      required: [id, plan_id, step_index, step_type, status]
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        step_index:
          type: integer
        step_type:
          $ref: '#/components/schemas/ProvisioningStepType'
        status:
          $ref: '#/components/schemas/StepStatus'
        error_details:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    DiscoveredWorkload:
      type: object
      required: [id, provider_type, workload_name, engine, endpoints, status, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        provider_type:
          $ref: '#/components/schemas/ProviderType'
        namespace:
          type: string
          nullable: true
        workload_name:
          type: string
        engine:
          type: string
          enum: [postgresql, mysql, mariadb]
        detected_version:
          type: string
          nullable: true
        endpoints:
          type: array
          items:
            type: string
        status:
          type: string
        details:
          type: object
          nullable: true
        last_seen_at:
          type: string
          format: date-time

    TriggerScanRequest:
      type: object
      properties:
        provider_type:
          $ref: '#/components/schemas/ProviderType'
        namespace:
          type: string
          nullable: true

    PromotionCandidate:
      type: object
      required: [host_id, role, replication_lag_bytes, replay_latency_ms, is_durable, health, suitability_score]
      properties:
        host_id:
          type: string
          format: uuid
        role:
          type: string
        replication_lag_bytes:
          type: integer
        replay_latency_ms:
          type: integer
        is_durable:
          type: boolean
        health:
          type: string
        suitability_score:
          type: integer

    RequestPromotionPayload:
      type: object
      required: [candidate_host_id]
      properties:
        candidate_host_id:
          type: string
          format: uuid
        target_epoch:
          type: integer
          nullable: true

    ApprovePromotionPayload:
      type: object
      properties:
        approval_token:
          type: string
          nullable: true

    FenceNodePayload:
      type: object
      required: [target_host_id]
      properties:
        target_host_id:
          type: string
          format: uuid
        fencing_type:
          type: string
          enum: [power_stonith, network_isolation, storage_detach, custom_webhook]

    PromotionRequest:
      type: object
      required: [id, cluster_id, candidate_host_id, target_epoch, status, safety_gates_passed, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        candidate_host_id:
          type: string
          format: uuid
        target_epoch:
          type: integer
        status:
          type: string
